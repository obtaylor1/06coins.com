<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#070706"/>
  <rect x="0" y="0" width="1400" height="92" fill="#090908"/>
  <line x1="0" y1="91" x2="1400" y2="91" stroke="#a88437" stroke-opacity=".45"/>
  <text x="62" y="49" fill="#d1ad58" font-family="Georgia,serif" font-size="31">06 COINS</text>
  <text x="63" y="70" fill="#d1ad58" fill-opacity=".7" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">PRIVATE OFFICE</text>

