    <text x="305" y="137" text-anchor="middle" fill="#d1ad58" font-family="Georgia,serif" font-size="27" letter-spacing="2">AUTHENTIC 06 COINS ISSUE</text>
    <text x="305" y="169" text-anchor="middle" fill="#eee4c8" fill-opacity=".65" font-family="Arial,sans-serif" font-size="13">This serial matches an authentic 1906 Limited Edition</text>
