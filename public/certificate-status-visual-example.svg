  <text x="700" y="864" text-anchor="middle" fill="#eee4c8" fill-opacity=".35" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">VERIFICATION RECORD SECURED BY 06 COINS PRIVATE OFFICE</text>
