    <g font-family="Arial,sans-serif" font-size="14">
      <line x1="40" y1="305" x2="570" y2="305" stroke="#a88437" stroke-opacity=".45"/>
      <text x="45" y="333" fill="#d1ad58" font-family="Georgia,serif">EDITION</text><text x="275" y="333" fill="#eee4c8" fill-opacity=".8">1906 Limited Edition</text>
      <line x1="40" y1="350" x2="570" y2="350" stroke="#a88437" stroke-opacity=".3"/>
      <text x="45" y="378" fill="#d1ad58" font-family="Georgia,serif">EDITION NUMBER</text><text x="275" y="378" fill="#eee4c8" fill-opacity=".8">128 of 1,906</text>
